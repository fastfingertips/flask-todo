{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="display-1 fw-bold" style="color: var(--app-danger);">404</h1>
            <h2 class="mb-4">Oops! Page Not Found.</h2>
            <p class="lead mb-5 text-secondary">Working on your todo list is great, but finding this page isn't. It seems the page you are looking for has been moved or doesn't exist.</p>
            <a href="{{ url_for('main.index') }}" class="btn px-5 py-2 fw-semibold app-btn-primary">
                Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
