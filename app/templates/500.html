{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="display-1 fw-bold" style="color: var(--app-danger);">500</h1>
            <h2 class="mb-4">Something Went Wrong!</h2>
            <p class="lead mb-5 text-secondary">Our server encountered an internal error and was unable to complete your request. Please try again or go back to home.</p>
            <a href="{{ url_for('main.index') }}" class="btn px-5 py-2 fw-semibold border app-btn-secondary">
                Try Again
            </a>
        </div>
    </div>
</div>
{% endblock %}
